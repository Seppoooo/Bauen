<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Gesamtansicht rendern</title></head>
<body style="background:#222;margin:0">
<canvas id="c"></canvas>
<script src="../js/modell.js"></script>
<script src="../js/render.js"></script>
<script>
  // Wird von tools/rendere-gesamtansicht.js geöffnet; Bereich um Berg, Schloss und Brücke
  const p = new URLSearchParams(location.search);
  const s = +(p.get('s') || 2);
  const bereich = (p.get('bereich') || '40,40,470,480').split(',').map(Number);
  const g = HogwartsModell.erzeugeGesamt(bereich);
  HogwartsRender.iso(document.getElementById('c'), g, { s, nacht: true });
  window.fertig = document.getElementById('c').toDataURL(p.get('typ') || 'image/webp', 0.86);
</script>
</body></html>
