name: Windows-Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Tests (inkl. echter Shared-Memory-Kopplung)
        run: python -m unittest discover -s tests -t . -v

      - name: Windows-Sprachausgabe prüfen
        run: python -c "from race_engineer.speech import Speaker; s = Speaker(); print('Backend:', s.backend, '| Stimme:', s.voice_name); assert s.backend == 'Windows SAPI'"

      - name: EXE bauen
        run: >
          pyinstaller --onefile --name RaceEngineer --noconfirm
          --add-data "race_engineer/web;race_engineer/web"
          --hidden-import win32com.client --hidden-import pythoncom
          run_engineer.py

      - name: EXE testen – Kopplung mit (simuliertem) RaceRoom
        shell: pwsh
        run: |
          $game = Start-Process -FilePath python -ArgumentList "tools/fake_r3e.py","40" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          $exe = Start-Process -FilePath dist\RaceEngineer.exe -ArgumentList "--no-voice","--no-browser","--port","8090" -PassThru
          Start-Sleep -Seconds 10
          $page = (Invoke-WebRequest -Uri http://localhost:8090/ -UseBasicParsing).Content
          if ($page -notmatch "Race Engineer") { throw "Dashboard nicht erreichbar" }
          $events = & curl.exe -s --max-time 4 http://localhost:8090/events
          $global:LASTEXITCODE = 0   # curl ends the endless event stream with a timeout on purpose
          $events | Select-Object -First 3 | ForEach-Object { $_.Substring(0, [Math]::Min(300, $_.Length)) }
          Stop-Process -Id $exe.Id -Force
          Stop-Process -Id $game.Id -Force -ErrorAction SilentlyContinue
          if (-not ($events -match '"connected": true')) { throw "EXE hat sich nicht mit RaceRoom gekoppelt" }
          if (-not ($events -match 'Kopplungstest')) { throw "Streckendaten kamen nicht an" }
          Write-Host "Kopplung OK"

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist\RaceEngineer.exe, settings.json, README.md package\
          Compress-Archive -Path package\* -DestinationPath RaceEngineer-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RaceEngineer-Windows
          path: RaceEngineer-Windows.zip

      - name: Download-Seite aktualisieren
        uses: softprops/action-gh-release@v2
        with:
          tag_name: race-engineer-latest
          name: Race Engineer – Windows-Download
          prerelease: true
          body: |
            **RaceEngineer-Windows.zip** herunterladen, entpacken, `RaceEngineer.exe` doppelklicken.
            Dann RaceRoom starten und auf die Strecke fahren – der Engineer koppelt sich automatisch.
            Gebaut aus Commit ${{ github.sha }}.
          files: RaceEngineer-Windows.zip
